# Serves the SPA and proxies /api to the backend, so everything is one origin.

upstream hypertube_backend {
    server backend:3000;
    keepalive 32;
}

# Video streaming responses must never be buffered to disk by nginx.
proxy_buffering            off;
proxy_request_buffering    off;
proxy_http_version         1.1;

server {
    listen      80;
    server_name _;

    root  /usr/share/nginx/html;
    index index.html;

    # Security headers
    add_header X-Content-Type-Options   "nosniff"            always;
    add_header X-Frame-Options          "DENY"               always;
    add_header Referrer-Policy          "no-referrer"        always;
    add_header Permissions-Policy       "camera=(), microphone=(), geolocation=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin"      always;
    # No inline scripts, no eval; images only from the poster CDNs we use.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://image.tmdb.org https://archive.org https://*.archive.org https://m.media-amazon.com http://www.publicdomaintorrents.info; media-src 'self' blob:; font-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

    client_max_body_size 8m;

    # Static assets
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # API
    location /api/ {
        proxy_pass         http://hypertube_backend;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Connection        "";

        # streaming: long reads, ranges passed through
        proxy_read_timeout    1h;
        proxy_send_timeout    1h;
        proxy_set_header      Range        $http_range;
        proxy_set_header      If-Range     $http_if_range;
        proxy_pass_header     Accept-Ranges;
        proxy_max_temp_file_size 0;
    }

    # SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }

    # Never serve dotfiles.
    location ~ /\. { deny all; }
}
